<!doctype html>
<html lang="{{page.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.url}}">
{{page.alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.brand}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:locale" content="{{L.locale}}">
<meta property="og:image" content="{{site.baseUrl}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css?v={{v.css}}">
{{page.head}}
</head>
<body class="kind-{{page.kind}}">
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{page.home}}"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="17" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 17V10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 3h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>{{site.brand}}</span></a>
    <nav class="nav" aria-label="{{L.ui.tools}}">{{page.nav}}</nav>
    <div class="lang" aria-label="{{L.ui.language}}">{{page.langSwitch}}</div>
  </div>
</header>
<main class="wrap">
{{page.body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{L.ui.footerNote}}</p>
    <p><a href="{{page.home}}">{{L.ui.allTools}}</a> · <a href="{{page.privacy}}">{{L.ui.privacy}}</a> · © {{year}} {{site.brand}}</p>
  </div>
</footer>
{{page.scripts}}
</body>
</html>
