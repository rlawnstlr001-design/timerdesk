<div class="tool calc salary" id="tool">
  <div class="calc-inputs">
    <label class="field"><span>{{t.wage}}</span><input type="number" id="wage" min="0" max="1000000" step="10" inputmode="numeric"></label>
    <label class="field"><span>{{t.dayHours}}</span><input type="number" id="dayHours" min="0" max="24" step="0.5" inputmode="decimal"></label>
    <label class="field"><span>{{t.days}}</span><select id="days"></select></label>
  </div>

  <div class="calc-result">
    <div class="result-label">{{t.weeklyPay}}</div>
    <div class="result-big" id="net">-</div>
    <div class="result-sub" id="netSub"></div>
  </div>

  <div class="sal-table-wrap">
    <table class="sal-table">
      <tbody id="breakdown"></tbody>
    </table>
  </div>
  <p class="hint" id="warn"></p>
  <p class="hint">{{t.disclaimer}}</p>
</div>
