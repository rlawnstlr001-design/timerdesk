<div class="tool calc salary" id="tool">
  <div class="calc-inputs">
    <label class="field"><span>{{t.annual}}</span><input type="number" id="annual" min="0" max="100000" step="100" inputmode="numeric"></label>
    <label class="field"><span>{{t.nontax}}</span><input type="number" id="nontax" min="0" max="1000" step="1" inputmode="numeric"></label>
    <label class="field"><span>{{t.family}}</span><select id="family"></select></label>
    <label class="field"><span>{{t.kids}}</span><select id="kids"></select></label>
    <label class="field"><span>{{t.ratio}}</span><select id="ratio"><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.2">120%</option></select></label>
    <label class="check"><input type="checkbox" id="severance"> {{t.severance}}</label>
  </div>

  <div class="calc-result">
    <div class="result-label">{{t.monthlyNet}}</div>
    <div class="result-big" id="net">-</div>
    <div class="result-sub" id="netSub"></div>
  </div>

  <div class="sal-table-wrap">
    <table class="sal-table">
      <tbody id="breakdown"></tbody>
    </table>
  </div>

  <details class="settings">
    <summary>{{t.byAnnualTitle}}</summary>
    <div class="sal-table-wrap">
      <table class="sal-table compact">
        <thead><tr><th>{{t.colAnnual}}</th><th>{{t.colMonthly}}</th><th>{{t.colDeduct}}</th><th>{{t.colNet}}</th></tr></thead>
        <tbody id="byAnnual"></tbody>
      </table>
    </div>
  </details>
  <p class="hint">{{t.disclaimer}}</p>
</div>
