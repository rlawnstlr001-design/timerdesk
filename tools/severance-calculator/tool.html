<div class="tool calc salary" id="tool">
  <div class="calc-inputs">
    <label class="field"><span>{{t.start}}</span><input type="date" id="start"></label>
    <label class="field"><span>{{t.end}}</span><input type="date" id="end"></label>
    <label class="field"><span>{{t.monthly}}</span><input type="number" id="monthly" min="0" max="100000" step="1" inputmode="numeric"></label>
    <label class="field"><span>{{t.bonus}}</span><input type="number" id="bonus" min="0" max="100000" step="1" inputmode="numeric"></label>
    <label class="field"><span>{{t.leave}}</span><input type="number" id="leave" min="0" max="10000" step="1" inputmode="numeric"></label>
  </div>

  <div class="calc-result">
    <div class="result-label">{{t.result}}</div>
    <div class="result-big" id="net">-</div>
    <div class="result-sub" id="netSub"></div>
  </div>

  <div class="sal-table-wrap">
    <table class="sal-table">
      <tbody id="breakdown"></tbody>
    </table>
  </div>
  <p class="hint">{{t.disclaimer}}</p>
</div>
